<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SessionShift</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="v2-popup" inert aria-busy="true">

    <!-- HERO — brand + active session with ambient hue -->
    <div class="v2-hero" id="heroSection">
      <div class="v2-hero-bg"></div>

      <div class="v2-hero-top">
        <div class="v2-brand">
          <img src="../icons/icon-128.png" alt="SessionShift" class="v2-logo">
          <div>
            <div class="v2-brand-title">SessionShift</div>
            <div class="v2-brand-sub" data-i18n="popupBrandSub">Multi-account manager</div>
          </div>
        </div>
        <div class="v2-hero-actions">
          <button id="themeToggle" class="v2-theme-toggle" type="button"
                  aria-label="Theme: system (click to change)"
                  title="Theme: system (click to change)"></button>
          <button id="openOptions" class="v2-options-btn" type="button"
                  data-i18n-aria-label="openOptionsLabel" data-i18n-title="openOptionsLabel"
                  aria-label="Open options"
                  title="Open options">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="v2-hero-active">
        <div class="v2-hero-label" data-i18n="heroActiveLabel">Active on this tab</div>
        <div class="v2-hero-session" id="heroSession">
          <div class="v2-hero-mark v2-mark-default" id="heroMark">
            <span class="v2-hero-mark-dot"></span>
          </div>
          <div class="v2-hero-info">
            <div class="v2-hero-name" id="heroName" dir="auto">Default</div>
            <div class="v2-hero-meta" id="heroMeta">No session scoped</div>
          </div>
        </div>
        <button id="btnRestoreAuto" class="v2-restore-auto" type="button" hidden data-i18n="restoreAutoMatch">Restore automatic matching</button>
      </div>
    </div>

    <!-- PROFILE / RULE VIEWS -->
    <div class="v2-view-tabs" role="tablist" aria-label="Configuration views">
      <button id="profilesViewTab" class="v2-view-tab active" role="tab" aria-selected="true" aria-controls="profilesView" data-i18n="profilesViewTab">Profiles</button>
      <button id="rulesViewTab" class="v2-view-tab" role="tab" aria-selected="false" aria-controls="rulesView" data-i18n="rulesViewTab">Rules</button>
      <button id="storageViewTab" class="v2-view-tab" role="tab" aria-selected="false" aria-controls="storageView">Storage</button>
    </div>

    <div id="profilesView" role="tabpanel" aria-labelledby="profilesViewTab">
      <!-- SEARCH -->
      <div class="v2-search-wrap" id="searchWrap">
        <svg class="v2-search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" class="v2-search" placeholder="Search profiles…" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchAriaLabel" aria-label="Search profiles">
      </div>

      <!-- CREATE PROFILE -->
      <div class="v2-create" id="createRow">
        <div class="v2-create-icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <input type="text" id="newSessionName" class="v2-create-input" placeholder="Name a new profile…" autocomplete="off" spellcheck="false" dir="auto"
               data-i18n-placeholder="createPlaceholder">
        <button id="btnNewSession" class="v2-create-btn">
          <span data-i18n="createButton">Create</span>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- SESSION LIST -->
      <div class="v2-list-wrap" id="savedSessionsList">
        <div class="v2-list-head">
          <span data-i18n="listHeadProfiles">Profiles</span>
          <span class="v2-list-count" id="sessionCount" aria-live="polite" aria-atomic="true">0</span>
        </div>
      </div>
    </div>

    <div id="rulesView" class="v2-rules-view" role="tabpanel" aria-labelledby="rulesViewTab" hidden>
      <div class="v2-rules-head">
        <div>
          <div class="v2-list-head-title" data-i18n="rulesViewTab">Rules</div>
          <div class="v2-rules-subtitle" data-i18n="rulesViewSubtitle">Automatically bind URLs to Profiles</div>
        </div>
      </div>
      <div class="v2-rule-subtabs" role="tablist" aria-label="Rule sections">
        <button id="ruleListTab" class="v2-rule-subtab active" type="button" role="tab" aria-selected="true" aria-controls="ruleListPanel" data-i18n="rulesViewTab">Rules</button>
        <button id="ruleFormTab" class="v2-rule-subtab" type="button" role="tab" aria-selected="false" aria-controls="ruleFormPanel" data-i18n="newRuleButton">New rule</button>
      </div>

      <div id="ruleListPanel" role="tabpanel" aria-labelledby="ruleListTab">
        <div id="ruleList" class="v2-rule-list" aria-live="polite"></div>
      </div>

      <div id="ruleFormPanel" role="tabpanel" aria-labelledby="ruleFormTab" hidden>
        <form id="ruleForm" class="v2-rule-form">
          <div class="v2-rule-form-title" id="ruleFormTitle" data-i18n="ruleFormNew">New rule</div>
          <label class="v2-rule-field"><span data-i18n="ruleFieldName">Name</span><input id="ruleName" required maxlength="200" autocomplete="off"></label>
          <label class="v2-rule-field"><span data-i18n="ruleFieldProfile">Profile</span><select id="ruleProfile" required></select></label>
          <div class="v2-rule-grid">
            <label class="v2-rule-field"><span data-i18n="ruleFieldScheme">Scheme</span><select id="ruleScheme" required><option value="https">https</option><option value="http">http</option></select></label>
            <label class="v2-rule-field"><span data-i18n="ruleFieldPort">Port</span><input id="rulePort" type="number" min="1" max="65535" inputmode="numeric" placeholder="Any"></label>
          </div>
          <label class="v2-rule-field"><span data-i18n="ruleFieldHostname">Hostname</span><input id="ruleHostname" required maxlength="253" autocomplete="off" placeholder="dev.example.com"></label>
          <label class="v2-rule-field"><span data-i18n="ruleFieldUrlRegex">URL regex</span> <span class="v2-rule-optional" data-i18n="ruleOptional">optional</span><input id="ruleRegex" maxlength="500" autocomplete="off" placeholder="^https://dev\\.example\\.com/"></label>
          <div class="v2-rule-grid">
            <label class="v2-rule-field v2-rule-check"><input id="ruleEnabled" type="checkbox" checked> <span data-i18n="ruleEnabled">Enabled</span></label>
            <label class="v2-rule-field"><span data-i18n="rulePriority">Priority</span><input id="rulePriority" type="number" min="0" max="1000000" value="100" inputmode="numeric"></label>
          </div>
          <button id="btnUseCurrentUrl" class="v2-rule-secondary-btn" type="button" data-i18n="ruleUseCurrentUrl">Use current URL</button>
          <label class="v2-rule-field"><span data-i18n="ruleTestUrl">Test URL</span><input id="ruleTestUrl" type="url" autocomplete="off" placeholder="https://dev.example.com/"></label>
          <div id="rulePreview" class="v2-rule-preview" aria-live="polite"></div>
          <div id="ruleFormError" class="v2-rule-error" role="alert" hidden></div>
          <div class="v2-rule-form-actions">
            <button id="btnCancelRule" class="v2-rule-secondary-btn" type="button" data-i18n="ruleCancel">Cancel</button>
            <button id="btnSaveRule" class="v2-rule-save-btn" type="submit" data-i18n="ruleSave">Save rule</button>
          </div>
        </form>
      </div>
    </div>

    <div id="storageView" class="v2-storage-view" role="tabpanel" aria-labelledby="storageViewTab" hidden>
      <div class="v2-storage-context-row">
        <div id="storageContext" class="v2-storage-context" dir="auto"></div>
        <button id="storageRefresh" class="v2-storage-refresh" type="button" aria-label="Refresh" title="Refresh">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 5.5A5 5 0 1 0 14 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13 2.5v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="v2-storage-subtabs" role="tablist" aria-label="Storage sections">
        <button class="v2-storage-subtab active" type="button" role="tab" aria-selected="true" aria-controls="storagePanel" data-storage-tab="localStorage">
          <span>Local</span><span class="v2-storage-count" data-storage-count>0</span>
        </button>
        <button class="v2-storage-subtab" type="button" role="tab" aria-selected="false" aria-controls="storagePanel" data-storage-tab="sessionStorage">
          <span>Session</span><span class="v2-storage-count" data-storage-count>0</span>
        </button>
        <button class="v2-storage-subtab" type="button" role="tab" aria-selected="false" aria-controls="storagePanel" data-storage-tab="cookies">
          <span>Cookies</span><span class="v2-storage-count" data-storage-count>0</span>
        </button>
      </div>

      <div class="v2-storage-search-wrap">
        <svg class="v2-storage-search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="storageSearch" class="v2-storage-search" type="search" placeholder="Search storage…" autocomplete="off" spellcheck="false" aria-label="Search storage">
        <button id="storageClearSearch" class="v2-storage-clear" type="button" aria-label="Clear search" hidden>×</button>
      </div>
      <div id="storageStatus" class="v2-storage-status" role="status" aria-live="polite"></div>

      <div id="storagePanel" role="tabpanel" aria-label="Storage data">
        <div id="storageList" class="v2-storage-list" aria-live="polite"></div>
        <div id="storageEmpty" class="v2-storage-empty" hidden>
          <div id="storageEmptyTitle" class="v2-storage-empty-title">No data</div>
          <div id="storageEmptySubtitle" class="v2-storage-empty-subtitle">This Profile has no stored values for the current page.</div>
        </div>
        <div id="storagePagination" class="v2-storage-pagination" hidden>
          <button id="storagePreviousPage" class="v2-storage-page-button" type="button" aria-label="Previous page">‹</button>
          <span id="storagePageInfo" class="v2-storage-page-info">1 / 1</span>
          <button id="storageNextPage" class="v2-storage-page-button" type="button" aria-label="Next page">›</button>
          <select id="storagePageSize" class="v2-storage-page-size" aria-label="Items per page">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span id="storagePageTotal" class="v2-storage-page-total">0 items</span>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div id="resetFooter" class="v2-footer">
      <div id="resetArea">
        <button id="btnDefault" class="v2-reset">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 3v3h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="resetToDefault">Reset to default</span>
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
